AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  DnDCloudCompagnon

  Sample SAM Template for DnDCloudCompagnon

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Parameters:
  BudgetAlertEmail:
    Type: String
    Description: Email address notified as soon as the AWS account incurs any real cost (i.e. leaves the Free Tier)
    Default: mathieu.verpillat@gmail.com
  SpellsDomainName:
    Type: String
    Description: Custom domain name (e.g. api.example.com) served by the CloudFront distribution
  SpellsCertificateArn:
    Type: String
    Description: >-
      ARN of the ACM certificate covering SpellsDomainName. Must be issued in us-east-1,
      regardless of the region this stack is deployed to, since CloudFront only accepts
      certificates from that region.

Resources:
  SpellsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: dndcloud-users
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email

  SpellsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref SpellsUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - implicit
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - https://example.com/callback
        - https://oauth.pstmn.io/v1/callback
      LogoutURLs:
        - https://example.com/logout

  SpellsUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref SpellsUserPool
      Domain: !Sub "dndcloud-${AWS::AccountId}"

  SpellsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${SpellsUserPool}"
              audience:
                - !Ref SpellsUserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  SpellsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DnD_Companion
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  SpellsApiFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: spells-api/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref SpellsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SpellsTable
      Events:
        ListSpells:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpellsHttpApi
            Path: /api/v1/spells
            Method: get
            Auth:
              Authorizer: NONE
        GetSpell:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpellsHttpApi
            Path: /api/v1/spells/{id}
            Method: get
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: true
        EntryPoints:
          - app.ts

  SpellsApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SpellsApiFunction}"
      RetentionInDays: 7

  FeatsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: feats-api/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref SpellsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SpellsTable
      Events:
        ListFeats:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpellsHttpApi
            Path: /api/v1/feats
            Method: get
            Auth:
              Authorizer: NONE
        GetFeat:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpellsHttpApi
            Path: /api/v1/feats/{id}
            Method: get
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: true
        EntryPoints:
          - app.ts

  FeatsApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FeatsApiFunction}"
      RetentionInDays: 7

  ItemsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: items-api/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref SpellsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SpellsTable
      Events:
        ListItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpellsHttpApi
            Path: /api/v1/items
            Method: get
            Auth:
              Authorizer: NONE
        GetItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpellsHttpApi
            Path: /api/v1/items/{id}
            Method: get
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: true
        EntryPoints:
          - app.ts

  ItemsApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ItemsApiFunction}"
      RetentionInDays: 7

  # Copie le Host du visiteur (le domaine CloudFront) dans un header custom X-Forwarded-Host.
  # On ne peut pas forwarder le header Host lui-même jusqu'à API Gateway : le endpoint execute-api
  # par défaut exige que Host corresponde exactement à son propre domaine et répond 403 Forbidden
  # sinon. Le header custom, lui, n'a aucune incidence sur le routage. Cf. lib/links.ts.
  SpellsForwardHostFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-forward-host"
      AutoPublish: true
      FunctionConfig:
        Comment: "Copie le Host du visiteur dans X-Forwarded-Host"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            request.headers['x-forwarded-host'] = { value: request.headers.host.value };
            return request;
        }

  # Policy CachingOptimized géré par AWS (658327ea-f89d-4fab-a63d-7e88639e58f6) exclut les query
  # strings de la clé de cache : les filtres ?school=/?level=/?class=/?tag=/?category=/?type=/?sort=
  # étaient bien transmis à l'origine (via OriginRequestPolicy) mais CloudFront servait la même
  # réponse en cache pour toutes les combinaisons. On whitelist donc explicitement ces paramètres
  # dans la clé de cache. Cette policy est partagée par toutes les routes de la distribution
  # (spells, feats et items), d'où la liste combinée des trois API.
  SpellsCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-spells-cache-policy"
        Comment: "Cache spells/feats/items responses par combinaison de filtres (school/level/class/tag/category/type/sort)"
        DefaultTTL: 86400
        MinTTL: 1
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings:
              - school
              - level
              - class
              - tag
              - category
              - type
              - sort
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none

  # Bucket privé hébergeant la webapp (Nuxt generate). Seul CloudFront peut le lire, via OAC.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SpellsDistribution}"

  # Fallback SPA : toute URL sans extension (/compendium/spells...) renvoie index.html.
  # On le fait ici plutôt qu'avec CustomErrorResponses, qui s'appliquerait aussi aux 403/404
  # de l'API (/api/v1/*) et les transformerait en 200 + HTML.
  WebSpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: "Réécrit les URLs sans extension vers /index.html (SPA)"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            if (request.uri.indexOf('.') === -1) {
                request.uri = '/index.html';
            }
            return request;
        }

  # Cache edge d'un an pour la webapp. MinTTL = 1 an : CloudFront ignore le "no-cache" posé sur
  # index.html/sw.js (qui sert à faire revalider les navigateurs) et ne retourne à S3 qu'après une
  # invalidation, déclenchée par scripts/deploy-webapp.sh à chaque déploiement.
  WebCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-web-cache-policy"
        DefaultTTL: 31536000
        MinTTL: 31536000
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig:
            QueryStringBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none

  SpellsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Aliases:
          - !Ref SpellsDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref SpellsCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        # Webapp statique (S3) par défaut ; l'API est servie sur le même domaine sous /api/v1/*
        DefaultCacheBehavior:
          TargetOriginId: WebBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: !Ref WebCachePolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebSpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/v1/*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref SpellsCachePolicy
            # AllViewerExceptHostHeader : Host doit rester celui d'API Gateway (voir SpellsForwardHostFunction
            # ci-dessus pour comment la Lambda récupère quand même le domaine public via X-Forwarded-Host).
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SpellsForwardHostFunction.FunctionARN
        Origins:
          - DomainName: !GetAtt WebBucket.RegionalDomainName
            Id: WebBucketOrigin
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - DomainName: !Sub "${SpellsHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            Id: ApiGatewayOrigin
            OriginPath: /prod
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

  # Zero-spend budget: this is an account-level resource (it tracks the whole
  # AWS account's bill, not just this stack) that alerts by email as soon as
  # any real charge appears, i.e. as soon as the account leaves the Free Tier.
  # AWS Budgets is a global billing service backed by us-east-1: if this stack
  # is deployed to another region and the resource fails to create, move it to
  # its own stack deployed in us-east-1.
  FreeTierBudgetAlarm:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-zero-spend-budget"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: "0.01"
          Unit: USD
        CostTypes:
          IncludeTax: true
          IncludeSubscription: true
          UseBlended: false
          IncludeRefund: false
          IncludeCredit: false
          IncludeUpfront: true
          IncludeRecurring: true
          IncludeOtherSubscription: true
          IncludeSupport: true
          IncludeDiscount: true
          UseAmortized: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  WebBucketName:
    Description: "S3 bucket hosting the webapp (target of the deploy script)"
    Value: !Ref WebBucket
  WebDistributionId:
    Description: "CloudFront distribution ID (for cache invalidation)"
    Value: !Ref SpellsDistribution
  WebUrl:
    Description: "Public URL of the webapp"
    Value: !Sub "https://${SpellsDomainName}/"
  SpellsTableName:
    Description: "DynamoDB table name storing spells data"
    Value: !Ref SpellsTable
  SpellsCloudFrontDomain:
    Description: "CloudFront distribution domain (use this for API requests)"
    Value: !GetAtt SpellsDistribution.DomainName
  SpellsCloudFrontEndpoint:
    Description: "Full CloudFront URL for accessing the Spells API"
    Value: !Sub "https://${SpellsDistribution.DomainName}/api/v1/spells"
  SpellsCustomDomainEndpoint:
    Description: "Full custom domain URL for accessing the Spells API"
    Value: !Sub "https://${SpellsDomainName}/api/v1/spells"
  SpellsApiGatewayEndpoint:
    Description: "Direct API Gateway endpoint (for admin use only, client requests should use CloudFront)"
    Value: !Sub "https://${SpellsHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/api/v1/spells"
  SpellsUserPoolId:
    Description: "Cognito User Pool ID used to authenticate API requests"
    Value: !Ref SpellsUserPool
  SpellsHostedUILoginUrl:
    Description: "Cognito Hosted UI login page (implicit flow, token returned in the callback URL fragment)"
    Value: !Sub "https://dndcloud-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${SpellsUserPoolClient}&response_type=token&scope=openid+email+profile&redirect_uri=https://example.com/callback"
  SpellsUserPoolClientId:
    Description: "Cognito User Pool Client ID used to authenticate API requests"
    Value: !Ref SpellsUserPoolClient
  SpellsApiFunction:
    Description: "Spells API Lambda Function ARN"
    Value: !GetAtt SpellsApiFunction.Arn
  SpellsApiFunctionIamRole:
    Description: "Implicit IAM Role created for the Spells API function"
    Value: !GetAtt SpellsApiFunctionRole.Arn
  FeatsCloudFrontEndpoint:
    Description: "Full CloudFront URL for accessing the Feats API"
    Value: !Sub "https://${SpellsDistribution.DomainName}/api/v1/feats"
  FeatsCustomDomainEndpoint:
    Description: "Full custom domain URL for accessing the Feats API"
    Value: !Sub "https://${SpellsDomainName}/api/v1/feats"
  FeatsApiGatewayEndpoint:
    Description: "Direct API Gateway endpoint (for admin use only, client requests should use CloudFront)"
    Value: !Sub "https://${SpellsHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/api/v1/feats"
  FeatsApiFunction:
    Description: "Feats API Lambda Function ARN"
    Value: !GetAtt FeatsApiFunction.Arn
  FeatsApiFunctionIamRole:
    Description: "Implicit IAM Role created for the Feats API function"
    Value: !GetAtt FeatsApiFunctionRole.Arn
  ItemsCloudFrontEndpoint:
    Description: "Full CloudFront URL for accessing the Items API"
    Value: !Sub "https://${SpellsDistribution.DomainName}/api/v1/items"
  ItemsCustomDomainEndpoint:
    Description: "Full custom domain URL for accessing the Items API"
    Value: !Sub "https://${SpellsDomainName}/api/v1/items"
  ItemsApiGatewayEndpoint:
    Description: "Direct API Gateway endpoint (for admin use only, client requests should use CloudFront)"
    Value: !Sub "https://${SpellsHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/api/v1/items"
  ItemsApiFunction:
    Description: "Items API Lambda Function ARN"
    Value: !GetAtt ItemsApiFunction.Arn
  ItemsApiFunctionIamRole:
    Description: "Implicit IAM Role created for the Items API function"
    Value: !GetAtt ItemsApiFunctionRole.Arn
